```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>App SPK Validator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Estilos personalizados para suporte visual e animações */
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    
    .glass-card {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* Animação para feedback de erro */
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }
    .shake {
      animation: shake 0.4s ease-in-out;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen relative overflow-x-hidden flex flex-col justify-center items-center">

  <!-- ================= TELA 1: VALIDAÇÃO DE KEY ================= -->
  <main id="screen1" class="w-full max-w-sm px-6 flex flex-col items-center -mt-20 transition-all duration-300">
    <!-- Card Principal de Validação -->
    <div class="w-full glass-card p-6 rounded-2xl shadow-2xl border border-slate-800 flex flex-col items-center">
      
      <div class="w-12 h-12 bg-indigo-600/20 text-indigo-400 rounded-xl flex items-center justify-center mb-4 border border-indigo-500/30">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 0121 9z" />
        </svg>
      </div>

      <h1 class="text-xl font-bold text-center mb-1 text-white">Acesso ao Sistema</h1>
      <p class="text-xs text-slate-400 text-center mb-6">Insira sua chave de acesso abaixo</p>

      <!-- Toolbox / Input de Key -->
      <div class="w-full mb-4">
        <label for="keyInput" class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Chave / Key</label>
        <input 
          type="text" 
          id="keyInput" 
          placeholder="Digite a Key (ex: 123)" 
          class="w-full px-4 py-3 rounded-xl bg-slate-900/80 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all duration-200 text-center text-lg font-mono tracking-widest"
          autocomplete="off"
        />
      </div>

      <!-- Mensagem de Erro -->
      <div id="errorMessage" class="hidden w-full p-2.5 mb-4 text-xs text-red-400 bg-red-950/40 border border-red-800/50 rounded-lg text-center font-medium">
        Key errada! Tente novamente.
      </div>

      <!-- Botão Validar Key -->
      <button 
        id="validateBtn" 
        onclick="validateKey()" 
        class="w-full py-3 px-4 bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-semibold rounded-xl shadow-lg shadow-indigo-600/30 active:scale-[0.98] transition-all duration-150 flex items-center justify-center gap-2"
      >
        <span>Validar Key</span>
      </button>
    </div>
  </main>


  <!-- ================= TELA 2: PAINEL / EXECUÇÃO ================= -->
  <main id="screen2" class="hidden w-full max-w-sm px-6 flex flex-col items-center transition-all duration-300">
    <div class="w-full glass-card p-6 rounded-2xl shadow-2xl border border-slate-800 flex flex-col items-center">
      
      <div class="w-12 h-12 bg-emerald-600/20 text-emerald-400 rounded-xl flex items-center justify-center mb-4 border border-emerald-500/30">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
      </div>

      <h2 class="text-xl font-bold text-center mb-1 text-white">Painel Principal</h2>
      <p class="text-xs text-slate-400 text-center mb-6">Key validada com sucesso!</p>

      <!-- Botão Executar -->
      <button 
        onclick="requestPermission()" 
        class="w-full py-3.5 px-4 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-bold rounded-xl shadow-lg shadow-emerald-600/30 active:scale-[0.98] transition-all duration-150 flex items-center justify-center gap-2"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd" />
        </svg>
        <span>Executar</span>
      </button>

      <button 
        onclick="resetApp()" 
        class="mt-4 text-xs text-slate-500 hover:text-slate-400 underline transition-colors"
      >
        Sair / Voltar
      </button>
    </div>
  </main>


  <!-- ================= MODAL DE PERMISSÃO (ANDROID OVERLAY) ================= -->
  <div id="permissionModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 w-full max-w-xs shadow-2xl animate-fade-in flex flex-col items-center text-center">
      
      <div class="w-14 h-14 bg-amber-500/10 text-amber-500 rounded-full flex items-center justify-center mb-4 border border-amber-500/20">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
        </svg>
      </div>

      <h3 class="text-base font-bold text-white mb-2">Permissão de Sobrepor Tela</h3>
      <p class="text-xs text-slate-400 mb-6 leading-relaxed">
        O aplicativo precisa de permissão para exibir sobre outros aplicativos (Display Over Other Apps).
      </p>

      <div class="flex gap-3 w-full">
        <button 
          onclick="denyPermission()" 
          class="flex-1 py-2.5 px-3 bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold rounded-xl text-xs transition-colors"
        >
          Negar
        </button>
        <button 
          onclick="grantPermission()" 
          class="flex-1 py-2.5 px-3 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-xl text-xs shadow-md shadow-indigo-600/30 transition-colors"
        >
          Permitir
        </button>
      </div>
    </div>
  </div>


  <!-- ================= BOTÃO FLUTUANTE ================= -->
  <!-- Posicionado no topo superior esquerdo (top: 10px, left: 10px) -->
  <button 
    id="floatingBtn" 
    onclick="onFloatingBtnClick()" 
    class="hidden fixed top-[10px] left-[10px] z-40 bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white p-3 rounded-2xl shadow-xl shadow-indigo-600/40 border border-indigo-400/30 transition-all duration-200 flex items-center justify-center group"
    title="Menu Flutuante"
  >
    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 group-hover:rotate-12 transition-transform duration-200" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
    </svg>
  </button>


  <!-- ================= LÓGICA JAVASCRIPT ================= -->
  <script>
    // Referências aos elementos
    const screen1 = document.getElementById('screen1');
    const screen2 = document.getElementById('screen2');
    const keyInput = document.getElementById('keyInput');
    const errorMessage = document.getElementById('errorMessage');
    const permissionModal = document.getElementById('permissionModal');
    const floatingBtn = document.getElementById('floatingBtn');

    // Suporte à tecla ENTER na input de key
    keyInput.addEventListener('keypress', function(event) {
      if (event.key === 'Enter') {
        validateKey();
      }
    });

    // Função de validação da Key
    function validateKey() {
      const val = keyInput.value.trim();

      if (val === '123') {
        // Esconde erro se houver
        errorMessage.classList.add('hidden');
        
        // Troca de Tela 1 -> Tela 2
        screen1.classList.add('hidden');
        screen2.classList.remove('hidden');
      } else {
        // Exibe mensagem de erro e aplica efeito Shake
        errorMessage.classList.remove('hidden');
        screen1.classList.add('shake');
        
        setTimeout(() => {
          screen1.classList.remove('shake');
        }, 400);
      }
    }

    // Solicita permissão (Abre Modal)
    function requestPermission() {
      permissionModal.classList.remove('hidden');
    }

    // Concede a permissão e ativa o botão flutuante
    function grantPermission() {
      permissionModal.classList.add('hidden');
      
      // Exibe o botão flutuante na posição exigida (top: 10px, left: 10px)
      floatingBtn.classList.remove('hidden');
    }

    // Nega a permissão
    function denyPermission() {
      permissionModal.classList.add('hidden');
    }

    // Clique no botão flutuante
    function onFloatingBtnClick() {
      // Feedback visual ao clicar no botão flutuante
      floatingBtn.classList.add('scale-110');
      setTimeout(() => floatingBtn.classList.remove('scale-110'), 200);
    }

    // Reinicia o estado do App
    function resetApp() {
      screen2.classList.add('hidden');
      screen1.classList.remove('hidden');
      keyInput.value = '';
      errorMessage.classList.add('hidden');
      floatingBtn.classList.add('hidden');
    }
  </script>
</body>
</html>
